name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    env:
      ZIG_VERSION: 0.16.0
      ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Tag or SHA
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Download Zig
        run: |
          wget $ZIG_URL -O zig.tar.xz
          mkdir -p zig
          tar -xf zig.tar.xz --strip-components=1 -C zig
          echo "$(pwd)/zig" >> $GITHUB_PATH

      - name: Build with Zig
        run: |
          zig/zig build -Dpackage_release=true

      - name: Package binaries
        run: |
          cd zig-out
          VERSION="${{ steps.set_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          for dir in *; do
            if [ -d "$dir" ]; then
              PKGDIR="blackcat-${dir}-${VERSION}"
              mkdir "$PKGDIR"
              cp -r "$dir"/* "$PKGDIR"/
              tar -czvf "${PKGDIR}.tgz" "$PKGDIR"
              rm -rf "$PKGDIR"
            fi
          done

      - name: Generate Changelog Since Previous Tag
        id: changelog
        run: |
          set -e
          current_tag="${{ steps.set_tag.outputs.tag }}"
          tags=$(git tag --sort=-creatordate)
          prev_tag=""
          found=""
          for tag in $tags; do
            if [ "$found" = "yes" ]; then
              prev_tag="$tag"
              break
            fi
            if [ "$tag" = "$current_tag" ]; then
              found="yes"
            fi
          done

          echo "## Changelog" > CHANGELOG.md
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$prev_tag..$current_tag" >> CHANGELOG.md
          else
            echo "First release or previous tag not found." >> CHANGELOG.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/*.tgz
          body_path: CHANGELOG.md
          make_latest: true
          name: blackcat ${{ steps.set_tag.outputs.tag }}
          tag_name: ${{ steps.set_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Bump Homebrew formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew tap j-c-m/tap
          TAG="${{ needs.build-and-release.outputs.tag }}"
          brew bump-formula-pr j-c-m/tap/blackcat --url "https://github.com/j-c-m/blackcat/archive/refs/tags/${TAG}.tar.gz"
