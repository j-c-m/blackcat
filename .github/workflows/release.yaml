name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: x86_64-linux
          - os: ubuntu-26.04-arm
            asset: aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: x86_64-macos
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            asset: x86_64-freebsd
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set release tag or SHA
        id: set_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Export package names
        shell: bash
        run: |
          echo "TAG=${{ steps.set_tag.outputs.tag }}" >> "$GITHUB_ENV"
          echo "ASSET=${{ matrix.asset }}" >> "$GITHUB_ENV"
          echo "TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.arch }}
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.arch }}
        with:
          key: ${{ matrix.asset }}

      - name: Build on Linux
        if: ${{ !matrix.arch && matrix.os != 'macos-latest' }}
        run: |
          set -euo pipefail
          cargo build --release
          sh .github/workflows/package.sh native "$ASSET" "$TAG"

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo build --release --target "$TARGET"
          sh .github/workflows/package.sh "$TARGET" "$ASSET" "$TAG"

      - name: Build on FreeBSD
        if: matrix.arch
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: x86_64
          mem: "8192"
          envs: TAG ASSET
          copyback: true
          prepare: pkg install -y curl ca_root_nss llvm
          run: |
            set -eu
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build --release
            sh .github/workflows/package.sh native "$ASSET" "$TAG"

            mkdir -p /opt/freebsd-arm64
            curl -L --fail -o /tmp/base.txz https://download.freebsd.org/ftp/releases/arm64/aarch64/15.1-RELEASE/base.txz
            tar -xpf /tmp/base.txz -C /opt/freebsd-arm64
            rm -f /tmp/base.txz
            cc=""
            for c in /usr/local/bin/clang /usr/local/bin/clang21 /usr/local/bin/clang20 /usr/local/bin/clang19 /usr/bin/clang; do
              if [ -x "$c" ] && "$c" -print-targets 2>/dev/null | grep -q aarch64; then
                cc=$c
                break
              fi
            done
            if [ -z "$cc" ]; then
              echo "no clang with an aarch64 target" >&2
              exit 1
            fi
            mkdir -p "$HOME/bin"
            printf '%s\n' '#!/bin/sh' "exec $cc --target=aarch64-unknown-freebsd --sysroot=/opt/freebsd-arm64 \"\$@\"" > "$HOME/bin/aarch64-freebsd-cc"
            chmod +x "$HOME/bin/aarch64-freebsd-cc"
            export PATH="$HOME/bin:$PATH"
            rustup target add aarch64-unknown-freebsd
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=aarch64-freebsd-cc
            cargo build --release --target aarch64-unknown-freebsd
            sh .github/workflows/package.sh aarch64-unknown-freebsd aarch64-freebsd "$TAG"
            rm -rf target

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tgz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag or SHA
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect archives
        run: |
          mkdir -p release
          find dist -name '*.tgz' -exec cp {} release/ \;
          ls -l release

      - name: Generate changelog since previous tag
        run: |
          set -euo pipefail
          current_tag="${{ steps.set_tag.outputs.tag }}"
          prev_tag=""
          found=""
          for tag in $(git tag --sort=-creatordate); do
            if [ "$found" = "yes" ]; then
              prev_tag="$tag"
              break
            fi
            if [ "$tag" = "$current_tag" ]; then
              found="yes"
            fi
          done
          echo "## Changelog" > CHANGELOG.md
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$prev_tag..$current_tag" >> CHANGELOG.md
          else
            echo "First release or previous tag not found." >> CHANGELOG.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          body_path: CHANGELOG.md
          make_latest: true
          name: blackcat ${{ steps.set_tag.outputs.tag }}
          tag_name: ${{ steps.set_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
