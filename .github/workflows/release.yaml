name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: ubuntu-26.04-arm
            asset: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            asset: freebsd-x86_64
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set release tag or SHA
        id: set_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Export package names
        shell: bash
        run: |
          echo "TAG=${{ steps.set_tag.outputs.tag }}" >> "$GITHUB_ENV"
          echo "ASSET=${{ matrix.asset }}" >> "$GITHUB_ENV"
          echo "TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.arch }}
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.arch }}
        with:
          key: ${{ matrix.asset }}

      - name: Build on Linux
        if: ${{ !matrix.arch && matrix.os != 'macos-latest' }}
        run: |
          set -euo pipefail
          cargo build --release
          sh .github/workflows/package.sh native "$ASSET" "$TAG"

      - name: Build on macOS
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo build --release --target "$TARGET"
          sh .github/workflows/package.sh "$TARGET" "$ASSET" "$TAG"

      - name: Build on FreeBSD
        if: matrix.arch
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: x86_64
          mem: "8192"
          envs: TAG ASSET
          copyback: true
          prepare: pkg install -y curl ca_root_nss llvm
          run: |
            set -eu
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build --release
            sh .github/workflows/package.sh native "$ASSET" "$TAG"

            mkdir -p /opt/freebsd-arm64
            curl -L --fail -o /tmp/base.txz https://download.freebsd.org/ftp/releases/arm64/aarch64/15.1-RELEASE/base.txz
            tar -xpf /tmp/base.txz -C /opt/freebsd-arm64
            rm -f /tmp/base.txz
            cc=""
            for c in /usr/local/bin/clang /usr/local/bin/clang21 /usr/local/bin/clang20 /usr/local/bin/clang19 /usr/bin/clang; do
              if [ -x "$c" ] && "$c" -print-targets 2>/dev/null | grep -q aarch64; then
                cc=$c
                break
              fi
            done
            if [ -z "$cc" ]; then
              echo "no clang with an aarch64 target" >&2
              exit 1
            fi
            mkdir -p "$HOME/bin"
            printf '%s\n' '#!/bin/sh' "exec $cc --target=aarch64-unknown-freebsd --sysroot=/opt/freebsd-arm64 \"\$@\"" > "$HOME/bin/aarch64-freebsd-cc"
            chmod +x "$HOME/bin/aarch64-freebsd-cc"
            export PATH="$HOME/bin:$PATH"
            rustup target add aarch64-unknown-freebsd
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=aarch64-freebsd-cc
            cargo build --release --target aarch64-unknown-freebsd
            sh .github/workflows/package.sh aarch64-unknown-freebsd freebsd-aarch64 "$TAG"
            rm -rf target

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*.tgz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag or SHA
        id: set_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect archives
        run: |
          mkdir -p release
          find dist -name '*.tgz' -exec cp {} release/ \;
          ls -l release

      - name: Generate changelog since previous tag
        run: |
          set -euo pipefail
          current_tag="${{ steps.set_tag.outputs.tag }}"
          prev_tag=""
          found=""
          for tag in $(git tag --sort=-creatordate); do
            if [ "$found" = "yes" ]; then
              prev_tag="$tag"
              break
            fi
            if [ "$tag" = "$current_tag" ]; then
              found="yes"
            fi
          done
          echo "## Changelog" > CHANGELOG.md
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$prev_tag..$current_tag" >> CHANGELOG.md
          else
            echo "First release or previous tag not found." >> CHANGELOG.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          body_path: CHANGELOG.md
          make_latest: true
          name: blackcat ${{ steps.set_tag.outputs.tag }}
          tag_name: ${{ steps.set_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Open formula PR on j-c-m/homebrew-tap
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          brew tap j-c-m/tap
          TAG="${{ needs.release.outputs.tag }}"
          brew bump-formula-pr j-c-m/tap/blackcat --write-only --no-browse \
            --url "https://github.com/j-c-m/blackcat/archive/refs/tags/${TAG}.tar.gz"
          TAP="$(brew --repository j-c-m/tap)"
          python3 - "$TAP/Formula/blackcat.rb" << 'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = '''  depends_on "zig@0.16" => :build

            def install
              system "zig", "build", "-Doptimize=ReleaseSmall", "-Dpackage_release=false"
              bin.install "zig-out/bin/blackcat"
            end
          '''
          new = '''  depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'depends_on "rust"' in text and "std_cargo_args" in text:
              pass
          else:
              raise SystemExit("formula is neither the Zig build nor Cargo")
          PY
          cd "$TAP"
          VERSION="${TAG#v}"
          BRANCH="bump-blackcat-${VERSION}"
          git checkout -B "$BRANCH"
          git add Formula/blackcat.rb
          git commit -m "blackcat ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --repo j-c-m/homebrew-tap --base main --head "$BRANCH" \
            --title "blackcat ${VERSION}" \
            --body "Update blackcat to ${TAG}."
