[package]
name = "blackcat"
version = "0.9.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/j-c-m/blackcat"
description = "Modern cat with Kitty graphics, ANSI rendering, and CP437"
readme = "README.md"
authors = ["Jesse Miller <https://jmiller.com/>"]

[[bin]]
name = "blackcat"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "tga", "qoi", "ff", "pnm", "webp"] }
libc = "0.2"
rustix = { version = "1", features = ["fs", "mm", "event", "termios", "process", "stdio", "shm"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
